name: poc_env
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  - ffmpeg            # system-level helper (conda-forge provides)
  - libgl            # for opencv visuals (conda-forge provides)
  - pip:
    - fastapi==0.116.1
    - uvicorn==0.33.0
    - python-dotenv==1.0.1
    - pymongo==4.8.0
    - motor==3.4.0
    - pydantic==2.9.2
    - numpy==1.24.4
    - pandas==2.0.3
    - scikit-learn==1.3.2
    - opencv-python==4.11.0.86
    - onnxruntime==1.15.1
    - openai==1.101.0
    - python-multipart==0.0.20
    - aiofiles==24.1.0
    - aiohttp==3.10.11
    - pdfplumber==0.11.5
    - PyMuPDF==1.24.11
    - python-docx==1.1.2
    - python-pptx==0.6.23
    - unstructured==0.11.8
    - requests==2.32.4
    - python-magic==0.4.27
    - tqdm==4.67.1

# Optional / heavy packages (install on-demand per-machine)
# - For CPU-only PyTorch, run: conda install -c pytorch pytorch torchvision cpuonly
# - For GPU PyTorch, follow https://pytorch.org/get-started/locally